# ---------------------------------------------------------------- CMN 4.966 (public, Portuguese)
- id: CMN-01
  question: Segundo a Resolução CMN 4.966, quando um ativo é caracterizado como ativo com problema de recuperação de crédito?
  lang: pt
  category: portuguese
  split: tune
  answerable: true
  gold_sections: [{doc_id: CMN-4966, section: "Art. 3º"}]
  gold_answer: "Com atraso superior a 90 dias no pagamento de principal ou encargos, ou indicativo de que a obrigação não será integralmente honrada sem recorrer a garantias."
  key_facts: ["90 (noventa) dias"]
  evidence: ["I - atraso superior a 90 (noventa) dias no pagamento de principal ou de encargos; ou"]
- id: CMN-02
  question: A reestruturação do ativo financeiro é considerada indicativo de ativo problemático?
  lang: pt
  category: portuguese
  split: heldout
  answerable: true
  gold_sections: [{doc_id: CMN-4966, section: "Art. 3º"}]
  gold_answer: "Sim, a reestruturação do ativo financeiro associado à obrigação é um dos indicativos (art. 3º, § 2º, II)."
  key_facts: ["reestruturação"]
  evidence: ["II - reestruturação do ativo financeiro associado à obrigação;"]
- id: CMN-03
  question: Quais instrumentos financeiros devem ser alocados no terceiro estágio?
  lang: pt
  category: portuguese
  split: tune
  answerable: true
  gold_sections: [{doc_id: CMN-4966, section: "Art. 37"}]
  gold_answer: "Os instrumentos financeiros com problema de recuperação de crédito."
  key_facts: ["problema de recuperação de crédito"]
  evidence: ["III - no terceiro estágio, os instrumentos financeiros com problema de recuperação de crédito."]
- id: CMN-04
  question: Quando um instrumento de uma contraparte vai para o terceiro estágio, o que acontece com os demais instrumentos da mesma contraparte?
  lang: pt
  category: portuguese
  split: tune
  answerable: true
  gold_sections: [{doc_id: CMN-4966, section: "Art. 37"}]
  gold_answer: "Todos devem ser realocados para o terceiro estágio na data-base do balancete do mês da alocação."
  key_facts: ["mesma contraparte"]
  evidence: ["a instituição deve realocar todos os instrumentos financeiros da mesma contraparte para o terceiro estágio"]
- id: CMN-05
  question: Como deve ser calculada a provisão para perdas esperadas no primeiro estágio?
  lang: pt
  category: portuguese
  split: tune
  answerable: true
  gold_sections: [{doc_id: CMN-4966, section: "Art. 47"}]
  gold_answer: "Pela perda esperada considerando a probabilidade de o instrumento se tornar ativo problemático nos próximos 12 meses (ou no prazo esperado, se menor)."
  key_facts: ["12 (doze) meses"]
  evidence: ["I - primeiro estágio: a provisão deve corresponder à perda esperada apurada pela instituição, considerando a probabilidade de o instrumento financeiro se caracterizar como ativo financeiro com problema de recuperação de crédito nos próximos 12 (doze) meses"]
- id: CMN-06
  question: No segundo estágio, a perda esperada considera qual horizonte?
  lang: pt
  category: portuguese
  split: heldout
  answerable: true
  gold_sections: [{doc_id: CMN-4966, section: "Art. 47"}]
  gold_answer: "Todo o prazo esperado do instrumento financeiro (perda esperada lifetime)."
  key_facts: ["todo o prazo esperado"]
  evidence: ["II - segundo estágio: a provisão deve corresponder à perda esperada apurada pela instituição, considerando a probabilidade de o instrumento financeiro se caracterizar como ativo com problema de recuperação de crédito durante todo o prazo esperado do instrumento financeiro"]
- id: CMN-07
  question: Por quanto tempo, no mínimo, a instituição deve manter controles sobre ativos baixados por perda?
  lang: pt
  category: portuguese
  split: tune
  answerable: true
  gold_sections: [{doc_id: CMN-4966, section: "Art. 49"}]
  gold_answer: "Enquanto não esgotados os procedimentos de cobrança, observado prazo mínimo de 5 anos."
  key_facts: ["5 (cinco) anos"]
  evidence: ["observado prazo mínimo de 5 (cinco) anos"]
- id: CMN-08
  question: Com que frequência a alocação em estágios deve ser revista para instrumentos de uma contraparte acima de 5% do patrimônio líquido?
  lang: pt
  category: portuguese
  split: tune
  answerable: true
  gold_sections: [{doc_id: CMN-4966, section: "Art. 39"}]
  gold_answer: "A cada 6 meses."
  key_facts: ["6 (seis) meses"]
  evidence: ["II - a cada 6 (seis) meses para instrumentos de uma mesma contraparte cujo montante seja superior a 5% (cinco por cento) do patrimônio líquido da instituição;"]
- id: CMN-09
  question: Em que categoria devem ser classificadas, como regra, as operações de crédito?
  lang: pt
  category: portuguese
  split: tune
  answerable: true
  gold_sections: [{doc_id: CMN-4966, section: "Art. 4º"}]
  gold_answer: "Na categoria custo amortizado, salvo as exceções do § 1º do art. 4º (valor justo no resultado)."
  key_facts: ["custo amortizado"]
  evidence: ["As operações de crédito e outras operações com característica de concessão de crédito devem ser classificadas na categoria custo amortizado"]
- id: CMN-10
  question: Quando a Resolução 4.966 entra em vigor para a maior parte dos dispositivos?
  lang: pt
  category: portuguese
  split: heldout
  answerable: true
  gold_sections: [{doc_id: CMN-4966, section: "Art. 81"}]
  gold_answer: "Em 1º de janeiro de 2025 (demais dispositivos); o Capítulo V (hedge) em 1º de janeiro de 2027."
  key_facts: ["1º de janeiro de 2025"]
  evidence: ["III - em 1º de janeiro de 2025, em relação aos demais dispositivos."]
- id: CMN-11
  question: Na transição, instrumentos com atraso superior a quantos dias devem ir para o segundo estágio?
  lang: pt
  category: portuguese
  split: tune
  answerable: true
  gold_sections: [{doc_id: CMN-4966, section: "Art. 72"}]
  gold_answer: "Atraso superior a 30 dias (admitido o primeiro estágio até 60 dias com evidências)."
  key_facts: ["30 (trinta) dias"]
  evidence: ["I - instrumentos financeiros com atraso superior a 30 (trinta) dias no pagamento de principal ou de encargos, que devem ser alocados no segundo estágio; e"]
- id: CMN-12
  question: A Resolução 4.966 se aplica às instituições de pagamento?
  lang: pt
  category: portuguese
  split: tune
  answerable: true
  gold_sections: [{doc_id: CMN-4966, section: "Art. 1º"}]
  gold_answer: "Não; o § 1º do art. 1º exclui as instituições de pagamento (e administradoras de consórcio, corretoras e distribuidoras)."
  key_facts: ["não se aplica"]
  evidence: ["O disposto nesta Resolução não se aplica:", "às instituições de pagamento"]
- id: CMN-13
  question: Qual a provisão exigida para um ativo baixado que volta a ser reconhecido por deixar de atender a condição de baixa?
  lang: pt
  category: portuguese
  split: tune
  answerable: true
  gold_sections: [{doc_id: CMN-4966, section: "Art. 49"}]
  gold_answer: "Provisão igual a 100% do valor do instrumento, caracterizado como ativo problemático (facultada provisão menor em certos casos)."
  key_facts: ["100%"]
  evidence: ["provisão para perdas esperadas associadas ao risco de crédito igual a 100% (cem"]
- id: CMN-14
  question: Com que frequência mínima a perda esperada deve ser revista para os instrumentos em geral?
  lang: pt
  category: portuguese
  split: heldout
  answerable: true
  gold_sections: [{doc_id: CMN-4966, section: "Art. 41"}]
  gold_answer: "A cada 12 meses (6 meses para contrapartes acima de 5% do PL), e sempre que fatos novos indicarem alteração relevante."
  key_facts: ["12 (doze) meses"]
  evidence: ["II - a cada 12 (doze) meses, para os demais instrumentos; e"]
- id: CMN-15
  question: Under Brazil's CMN Resolution 4,966, after how many days past due is an asset considered credit-impaired?
  lang: en
  category: portuguese
  split: tune
  answerable: true
  gold_sections: [{doc_id: CMN-4966, section: "Art. 3º"}]
  gold_answer: "More than 90 days past due on principal or charges."
  key_facts: ["90"]
  evidence: ["I - atraso superior a 90 (noventa) dias no pagamento de principal ou de encargos; ou"]
  notes: "Cross-lingual: English question over Portuguese source. Category kept as portuguese (doc-based)."
