# Credit Policy Copilot golden set (M2).
# Every answerable item lists gold_sections (doc_id + section path, matched exactly or as a " > "-suffix of
# the parsed section path) and verbatim `evidence` quotes that tests/test_golden_set.py checks against the
# parsed corpus text of those sections (whitespace/case-insensitive). key_facts are short strings that a
# correct answer must contain (lexical, non-LLM proxy for correctness).
# split: "tune" may be used to choose thresholds; "heldout" must never be used for tuning.
version: 1
items:
# ---------------------------------------------------------------- single-hop: MB-POL-001 card underwriting
- id: CARD-01
  question: What is the minimum bureau score for an unsecured credit card?
  lang: en
  category: single_hop
  split: tune
  answerable: true
  gold_sections: [{doc_id: MB-POL-001, section: "2. Eligibility Requirements > 2.2 Credit Bureau Requirements"}]
  gold_answer: "620."
  key_facts: ["620"]
  evidence: ["The minimum bureau score for an unsecured card is 620."]
- id: CARD-02
  question: Which card product can be offered to an applicant whose bureau score is between 580 and 619?
  lang: en
  category: single_hop
  split: heldout
  answerable: true
  gold_sections: [{doc_id: MB-POL-001, section: "2. Eligibility Requirements > 2.2 Credit Bureau Requirements"}]
  gold_answer: "Only the Meridian Secured Card."
  key_facts: ["Secured Card"]
  evidence: ["Applicants with a bureau score between 580 and 619 may only be offered the Meridian Secured Card."]
- id: CARD-03
  question: How recent must the credit bureau report be for a card application?
  lang: en
  category: single_hop
  split: tune
  answerable: true
  gold_sections: [{doc_id: MB-POL-001, section: "2. Eligibility Requirements > 2.2 Credit Bureau Requirements"}]
  gold_answer: "No older than 30 days."
  key_facts: ["30 days"]
  evidence: ["A credit bureau report no older than 30 days is required for every application."]
- id: CARD-04
  question: Which Meridian Risk Score range maps to risk grade C?
  lang: en
  category: numeric
  split: tune
  answerable: true
  gold_sections: [{doc_id: MB-POL-001, section: "3. Risk Grading > 3.1 Meridian Risk Score"}]
  gold_answer: "640 to 699."
  key_facts: ["640 to 699"]
  evidence: ["| C | 640 to 699 |"]
- id: CARD-05
  question: What is the maximum debt-to-income ratio for a credit card applicant, and how is the new card's payment included?
  lang: en
  category: numeric
  split: tune
  answerable: true
  gold_sections: [{doc_id: MB-POL-001, section: "3. Risk Grading > 3.2 Affordability"}]
  gold_answer: "45%, including a minimum payment on the proposed card calculated as 3% of the proposed limit."
  key_facts: ["45%", "3%"]
  evidence: ["calculated as 3% of the proposed limit, must not exceed 45%"]
- id: CARD-06
  question: What is the maximum initial credit limit for a risk grade A card applicant?
  lang: en
  category: numeric
  split: heldout
  answerable: true
  gold_sections: [{doc_id: MB-POL-001, section: "4. Credit Limit Assignment > 4.1 Limit Formula"}]
  gold_answer: "USD 25,000 (or three times verified net monthly income, if lower)."
  key_facts: ["25,000"]
  evidence: ["| A | 25,000 |"]
- id: CARD-07
  question: How is the initial credit limit on a new card calculated?
  lang: en
  category: single_hop
  split: tune
  answerable: true
  gold_sections: [{doc_id: MB-POL-001, section: "4. Credit Limit Assignment > 4.1 Limit Formula"}]
  gold_answer: "The lower of the risk grade cap and three times verified net monthly income, rounded down to the nearest 100."
  key_facts: ["three times", "net monthly income"]
  evidence: ["The initial credit limit is the lower of (a) the risk grade cap and (b) three times the applicant's verified net monthly income, rounded down to the nearest 100."]
- id: CARD-08
  question: What deposit amounts are allowed for the Meridian Secured Card?
  lang: en
  category: numeric
  split: tune
  answerable: true
  gold_sections: [{doc_id: MB-POL-001, section: "4. Credit Limit Assignment > 4.2 Secured Card"}]
  gold_answer: "Between USD 300 and USD 3,000; the limit equals the deposit."
  key_facts: ["300", "3,000"]
  evidence: ["between USD 300 and USD 3,000"]
- id: CARD-09
  question: After how many on-time payments is a secured card account reviewed for graduation to an unsecured card?
  lang: en
  category: numeric
  split: tune
  answerable: true
  gold_sections: [{doc_id: MB-POL-001, section: "4. Credit Limit Assignment > 4.2 Secured Card"}]
  gold_answer: "After 12 consecutive on-time payments."
  key_facts: ["12 consecutive"]
  evidence: ["After 12 consecutive on-time payments the account is reviewed for graduation to an unsecured card."]
- id: CARD-10
  question: What credit limit range applies to the Meridian Starter Card?
  lang: en
  category: numeric
  split: tune
  answerable: true
  gold_sections: [{doc_id: MB-POL-001, section: "4. Credit Limit Assignment > 4.3 Starter Card for Thin-File Applicants"}]
  gold_answer: "USD 500 to USD 1,500, with no limit increase in the first 6 months."
  key_facts: ["500", "1,500"]
  evidence: ["a limit between USD 500 and USD 1,500"]
- id: CARD-11
  question: How often can a cardholder receive a credit limit increase?
  lang: en
  category: single_hop
  split: tune
  answerable: true
  gold_sections: [{doc_id: MB-POL-001, section: "4. Credit Limit Assignment > 4.4 Credit Limit Increases"}]
  gold_answer: "No more than once every 6 months, and only with no 30+ days past due payment in the last 12 months."
  key_facts: ["6 months"]
  evidence: ["no more than once every 6 months"]
- id: CARD-12
  question: When must a card applicant's income be verified with documents?
  lang: en
  category: single_hop
  split: heldout
  answerable: true
  gold_sections: [{doc_id: MB-POL-001, section: "5. Income Verification"}]
  gold_answer: "When the requested or assigned limit exceeds USD 5,000, or stated income is more than twice the occupation median."
  key_facts: ["5,000"]
  evidence: ["when the requested or assigned limit exceeds USD 5,000"]
- id: CARD-13
  question: Within how many days must a declined card applicant receive an adverse action notice?
  lang: en
  category: numeric
  split: heldout
  answerable: true
  gold_sections: [{doc_id: MB-POL-001, section: "6. Adverse Action"}]
  gold_answer: "Within 30 days."
  key_facts: ["30 days"]
  evidence: ["must receive an adverse action notice within 30 days"]
- id: CARD-14
  question: Can we issue a card to an applicant whose bankruptcy was discharged 18 months ago?
  lang: en
  category: numeric
  split: tune
  answerable: true
  gold_sections: [{doc_id: MB-POL-001, section: "2. Eligibility Requirements > 2.1 Applicant Eligibility"}]
  gold_answer: "No. Applicants must have no bankruptcy discharged in the last 24 months, and this cannot be waived."
  key_facts: ["24 months"]
  evidence: ["The applicant has no bankruptcy discharged in the last 24 months."]
- id: CARD-15
  question: What early delinquency measure does Retail Credit Risk report every month for cards?
  lang: en
  category: single_hop
  split: tune
  answerable: true
  gold_sections: [{doc_id: MB-POL-001, section: "7. Monitoring"}]
  gold_answer: "Accounts 30+ days past due within 6 months on book."
  key_facts: ["30+ days past due within 6 months"]
  evidence: ["early delinquency (30+ days past due within 6 months on book)"]
# ---------------------------------------------------------------- MB-POL-002 personal loans
- id: LOAN-01
  question: What are the minimum and maximum personal loan amounts?
  lang: en
  category: numeric
  split: tune
  answerable: true
  gold_sections: [{doc_id: MB-POL-002, section: "2. Product Parameters > 2.1 Amounts and Terms"}]
  gold_answer: "USD 1,000 minimum and USD 50,000 maximum, subject to risk grade caps."
  key_facts: ["1,000", "50,000"]
  evidence: ["Minimum loan amount: USD 1,000.", "Maximum loan amount: USD 50,000"]
- id: LOAN-02
  question: Who is eligible for personal loan terms between 61 and 84 months?
  lang: en
  category: single_hop
  split: tune
  answerable: true
  gold_sections: [{doc_id: MB-POL-002, section: "2. Product Parameters > 2.1 Amounts and Terms"}]
  gold_answer: "Only risk grade A applicants borrowing more than USD 25,000."
  key_facts: ["grade A", "25,000"]
  evidence: ["Terms of 61 to 84 months are only available for risk grade A applicants borrowing more than USD 25,000."]
- id: LOAN-03
  question: What is the cap on a customer's total unsecured exposure across all Meridian products?
  lang: en
  category: numeric
  split: tune
  answerable: true
  gold_sections: [{doc_id: MB-POL-002, section: "2. Product Parameters > 2.2 Aggregate Unsecured Exposure"}]
  gold_answer: "USD 75,000; above that requires Credit Committee approval."
  key_facts: ["75,000"]
  evidence: ["must not exceed USD 75,000"]
- id: LOAN-04
  question: What APR band applies to a risk grade C personal loan?
  lang: en
  category: numeric
  split: heldout
  answerable: true
  gold_sections: [{doc_id: MB-POL-002, section: "3. Limits by Risk Grade"}]
  gold_answer: "17.00% to 23.99%."
  key_facts: ["17.00%", "23.99%"]
  evidence: ["| C | 20,000 | 40% | 17.00% to 23.99% |"]
- id: LOAN-05
  question: What is the largest personal loan a risk grade D applicant can get?
  lang: en
  category: numeric
  split: tune
  answerable: true
  gold_sections: [{doc_id: MB-POL-002, section: "3. Limits by Risk Grade"}]
  gold_answer: "USD 7,500."
  key_facts: ["7,500"]
  evidence: ["| D | 7,500 | 35% | 24.00% to 29.99% |"]
- id: LOAN-06
  question: What relationship discount can a personal loan customer receive on the APR?
  lang: en
  category: single_hop
  split: tune
  answerable: true
  gold_sections: [{doc_id: MB-POL-002, section: "4. Pricing > 4.1 Rate Setting"}]
  gold_answer: "0.50 percentage points for customers with active direct deposit for at least 6 months, staying within the band."
  key_facts: ["0.50"]
  evidence: ["receive a 0.50 percentage point relationship discount"]
- id: LOAN-07
  question: How much is the personal loan origination fee?
  lang: en
  category: numeric
  split: tune
  answerable: true
  gold_sections: [{doc_id: MB-POL-002, section: "4. Pricing > 4.2 Fees"}]
  gold_answer: "1% of the loan amount, capped at USD 500."
  key_facts: ["1%", "500"]
  evidence: ["The origination fee is 1% of the loan amount, capped at USD 500."]
- id: LOAN-08
  question: When is a late fee charged on a personal loan and how much is it?
  lang: en
  category: numeric
  split: tune
  answerable: true
  gold_sections: [{doc_id: MB-POL-002, section: "4. Pricing > 4.2 Fees"}]
  gold_answer: "USD 25 when a payment is more than 10 days late."
  key_facts: ["25", "10 days"]
  evidence: ["The late fee is USD 25 when a payment is more than 10 days late."]
- id: LOAN-09
  question: Which personal loans require income verification?
  lang: en
  category: single_hop
  split: heldout
  answerable: true
  gold_sections: [{doc_id: MB-POL-002, section: "5. Verification Requirements"}]
  gold_answer: "Every loan above USD 10,000 and every loan to a risk grade C or D applicant."
  key_facts: ["10,000"]
  evidence: ["mandatory for every personal loan above USD 10,000"]
- id: LOAN-10
  question: For a debt consolidation loan, how much of the proceeds must go directly to the creditors?
  lang: en
  category: numeric
  split: heldout
  answerable: true
  gold_sections: [{doc_id: MB-POL-002, section: "6. Debt Consolidation Loans"}]
  gold_answer: "At least 70%."
  key_facts: ["70%"]
  evidence: ["at least 70% of the proceeds must be disbursed directly to the creditors"]
- id: LOAN-11
  question: How long is the cooling-off period to cancel a personal loan without fees?
  lang: en
  category: numeric
  split: tune
  answerable: true
  gold_sections: [{doc_id: MB-POL-002, section: "7. Cooling-Off Period"}]
  gold_answer: "14 calendar days from disbursement (accrued interest is still charged)."
  key_facts: ["14 calendar days"]
  evidence: ["within 14 calendar days of disbursement"]
- id: LOAN-12
  question: Can a risk grade B applicant take a USD 30,000 personal loan over 72 months?
  lang: en
  category: numeric
  split: tune
  answerable: true
  gold_sections: [{doc_id: MB-POL-002, section: "2. Product Parameters > 2.1 Amounts and Terms"}]
  gold_answer: "No. Terms above 60 months are only for grade A applicants borrowing more than USD 25,000."
  key_facts: ["grade A"]
  evidence: ["Standard terms: 12 to 60 months.", "Terms of 61 to 84 months are only available for risk grade A applicants"]
# ---------------------------------------------------------------- MB-POL-003 collateral
- id: COLL-01
  question: What is the maximum loan-to-value for a used vehicle?
  lang: en
  category: numeric
  split: tune
  answerable: true
  gold_sections: [{doc_id: MB-POL-003, section: "2. Eligible Collateral and Loan-to-Value Limits > 2.1 Maximum Loan-to-Value"}]
  gold_answer: "80% of the pricing guide value (vehicles 1 to 8 years old)."
  key_facts: ["80%"]
  evidence: ["| Used vehicle (1 to 8 years old) | Pricing guide value | 80% |"]
- id: COLL-02
  question: What combined LTV limit applies to a home equity line on a second lien?
  lang: en
  category: numeric
  split: heldout
  answerable: true
  gold_sections: [{doc_id: MB-POL-003, section: "2. Eligible Collateral and Loan-to-Value Limits > 2.1 Maximum Loan-to-Value"}]
  gold_answer: "70% combined LTV."
  key_facts: ["70%"]
  evidence: ["| Residential real estate, second lien (home equity) | Independent appraisal | 70% combined LTV |"]
- id: COLL-03
  question: Can a customer pledge cryptocurrency as collateral?
  lang: en
  category: single_hop
  split: tune
  answerable: true
  gold_sections: [{doc_id: MB-POL-003, section: "2. Eligible Collateral and Loan-to-Value Limits > 2.1 Maximum Loan-to-Value"}]
  gold_answer: "No, cryptocurrencies are not eligible collateral."
  key_facts: ["cryptocurrencies"]
  evidence: ["cryptocurrencies, art, jewelry and unlisted shares are not eligible collateral"]
- id: COLL-04
  question: What extra haircut applies when one security is more than 40% of a pledged portfolio?
  lang: en
  category: numeric
  split: tune
  answerable: true
  gold_sections: [{doc_id: MB-POL-003, section: "2. Eligible Collateral and Loan-to-Value Limits > 2.2 Haircuts for Concentrated Securities"}]
  gold_answer: "An additional 20% haircut on that position."
  key_facts: ["20%"]
  evidence: ["an additional 20% haircut is applied to that position"]
- id: COLL-05
  question: How old can a real estate appraisal be at origination?
  lang: en
  category: numeric
  split: tune
  answerable: true
  gold_sections: [{doc_id: MB-POL-003, section: "3. Valuation > 3.1 Appraisals"}]
  gold_answer: "No older than 6 months."
  key_facts: ["6 months"]
  evidence: ["must be no older than 6 months at origination"]
- id: COLL-06
  question: How often must real estate collateral be revalued?
  lang: en
  category: single_hop
  split: tune
  answerable: true
  gold_sections: [{doc_id: MB-POL-003, section: "3. Valuation > 3.2 Revaluation Frequency"}]
  gold_answer: "Every 36 months, and immediately when the loan becomes 90+ days past due."
  key_facts: ["36 months"]
  evidence: ["Real estate: every 36 months, and immediately when the loan becomes 90 or more days past due."]
- id: COLL-07
  question: At what LTV is a margin call triggered on a securities-backed loan, and what must the customer do?
  lang: en
  category: numeric
  split: tune
  answerable: true
  gold_sections: [{doc_id: MB-POL-003, section: "3. Valuation > 3.3 Margin Calls on Securities"}]
  gold_answer: "Above 65%; restore LTV to 50% within 5 business days."
  key_facts: ["65%", "50%"]
  evidence: ["If the LTV of a securities-backed loan rises above 65%, the customer must be asked to restore the LTV to 50% within 5 business days"]
- id: COLL-08
  question: At what LTV may the bank sell pledged securities without further notice?
  lang: en
  category: numeric
  split: heldout
  answerable: true
  gold_sections: [{doc_id: MB-POL-003, section: "3. Valuation > 3.3 Margin Calls on Securities"}]
  gold_answer: "75%."
  key_facts: ["75%"]
  evidence: ["If the LTV reaches 75%, the bank may sell pledged securities without further notice"]
- id: COLL-09
  question: For a vehicle bought through an approved dealer, how long do we have to record the lien?
  lang: en
  category: numeric
  split: tune
  answerable: true
  gold_sections: [{doc_id: MB-POL-003, section: "4. Perfection and Documentation"}]
  gold_answer: "30 days."
  key_facts: ["30 days"]
  evidence: ["where the lien must be recorded within 30 days"]
- id: COLL-10
  question: How often does the Collateral Committee meet and who chairs it?
  lang: en
  category: single_hop
  split: tune
  answerable: true
  gold_sections: [{doc_id: MB-POL-003, section: "6. Collateral Exceptions"}]
  gold_answer: "Weekly; chaired by the Head of Retail Credit."
  key_facts: ["weekly", "Head of Retail Credit"]
  evidence: ["The Collateral Committee meets weekly and is chaired by the Head of Retail Credit."]
- id: COLL-11
  question: What insurance is required on vehicle or real estate collateral?
  lang: en
  category: single_hop
  split: heldout
  answerable: true
  gold_sections: [{doc_id: MB-POL-003, section: "7. Insurance"}]
  gold_answer: "Insurance for at least the outstanding loan amount with Meridian Bank named as loss payee."
  key_facts: ["loss payee"]
  evidence: ["insured for at least the outstanding loan amount, with Meridian Bank named as loss payee"]
# ---------------------------------------------------------------- MB-POL-004 collections
- id: COLX-01
  question: At how many days past due is a credit card balance charged off?
  lang: en
  category: single_hop
  split: tune
  answerable: true
  gold_sections:
    - {doc_id: MB-POL-004, section: "5. Non-Accrual and Charge-Off", alt: [{doc_id: MB-POL-008, section: "2. Analyst FAQ > 2.4 When does a credit card get charged off?"}]}
  gold_answer: "180 days past due."
  key_facts: ["180 days"]
  evidence: ["Credit card balances are charged off at 180 days past due."]
- id: COLX-02
  question: When do interest and fees stop accruing on a delinquent account?
  lang: en
  category: single_hop
  split: tune
  answerable: true
  gold_sections: [{doc_id: MB-POL-004, section: "5. Non-Accrual and Charge-Off"}]
  gold_answer: "At 90 days past due (non-accrual status)."
  key_facts: ["90 days"]
  evidence: ["Interest and fees stop accruing (non-accrual status) when an account reaches 90 days past due."]
- id: COLX-03
  question: Which days-past-due range is Bucket 3 and who owns it?
  lang: en
  category: numeric
  split: tune
  answerable: true
  gold_sections: [{doc_id: MB-POL-004, section: "2. Delinquency Buckets"}]
  gold_answer: "90 to 119 days past due; Collections late stage team."
  key_facts: ["90 to 119"]
  evidence: ["| Bucket 3 | 90 to 119 | Collections, late stage team |"]
- id: COLX-04
  question: By which day past due must the first payment reminder be sent?
  lang: en
  category: numeric
  split: tune
  answerable: true
  gold_sections: [{doc_id: MB-POL-004, section: "3. Customer Contact Standards > 3.1 First Contact"}]
  gold_answer: "No later than day 5 past due."
  key_facts: ["day 5"]
  evidence: ["must be sent no later than day 5 past due"]
- id: COLX-05
  question: During which hours may collectors call customers?
  lang: en
  category: single_hop
  split: tune
  answerable: true
  gold_sections: [{doc_id: MB-POL-004, section: "3. Customer Contact Standards > 3.2 Contact Limits"}]
  gold_answer: "Between 8:00 a.m. and 9:00 p.m. in the customer's local time."
  key_facts: ["8:00 a.m.", "9:00 p.m."]
  evidence: ["Calls may only be placed between 8:00 a.m. and 9:00 p.m. in the customer's local time."]
- id: COLX-06
  question: How long can the Specialist Support team pause collection activity for a vulnerable customer?
  lang: en
  category: numeric
  split: heldout
  answerable: true
  gold_sections: [{doc_id: MB-POL-004, section: "3. Customer Contact Standards > 3.3 Vulnerable Customers"}]
  gold_answer: "Up to 60 days."
  key_facts: ["60 days"]
  evidence: ["can pause collection activity for up to 60 days"]
- id: COLX-07
  question: How much can the Hardship Program reduce the monthly payment, and for how long?
  lang: en
  category: numeric
  split: tune
  answerable: true
  gold_sections: [{doc_id: MB-POL-004, section: "4. Hardship and Forbearance > 4.1 Hardship Program"}]
  gold_answer: "By up to 50% for up to 12 months (card APR reduced to 9.99%)."
  key_facts: ["50%", "12 months"]
  evidence: ["reduce the required monthly payment by up to 50% for up to 12 months"]
- id: COLX-08
  question: How many times can a customer enroll in the Hardship Program?
  lang: en
  category: numeric
  split: tune
  answerable: true
  gold_sections: [{doc_id: MB-POL-004, section: "4. Hardship and Forbearance > 4.2 Eligibility Limits"}]
  gold_answer: "No more than 2 times in any 5-year period."
  key_facts: ["2 times"]
  evidence: ["no more than 2 times in any 5-year period"]
- id: COLX-09
  question: What must happen before a delinquent account can be re-aged, and how often is re-aging allowed?
  lang: en
  category: single_hop
  split: heldout
  answerable: true
  gold_sections: [{doc_id: MB-POL-004, section: "4. Hardship and Forbearance > 4.3 Re-aging"}]
  gold_answer: "3 consecutive full monthly payments under a new agreement; at most once in 12 months and twice in 5 years."
  key_facts: ["3 consecutive"]
  evidence: ["only after the customer makes 3 consecutive full monthly payments under a new agreement"]
- id: COLX-10
  question: Who must approve a 40% settlement discount on a 120-day delinquent account?
  lang: en
  category: numeric
  split: tune
  answerable: true
  gold_sections: [{doc_id: MB-POL-004, section: "6. Settlements"}]
  gold_answer: "A Collections Manager (discounts between 30% and 50%)."
  key_facts: ["Collections Manager"]
  evidence: ["Settlement discounts between 30% and 50% require approval from a Collections Manager."]
- id: COLX-11
  question: How soon after a bankruptcy notification is the account charged off?
