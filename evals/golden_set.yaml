  category: numeric
  split: heldout
  answerable: true
  gold_sections: [{doc_id: MB-POL-004, section: "5. Non-Accrual and Charge-Off"}]
  gold_answer: "Within 60 days, unless secured and fully covered by collateral."
  key_facts: ["60 days"]
  evidence: ["are charged off within 60 days of notification"]
- id: COLX-12
  question: When can an account be placed with an external collection agency?
  lang: en
  category: single_hop
  split: tune
  answerable: true
  gold_sections: [{doc_id: MB-POL-004, section: "7. Third-Party Agencies"}]
  gold_answer: "Only after charge-off."
  key_facts: ["after charge-off"]
  evidence: ["Accounts may be placed with an external collection agency only after charge-off."]
