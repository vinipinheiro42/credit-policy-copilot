# Local-only CI definition (this repo has never been pushed). Run the same steps locally with
# `scripts/ci_local.sh`, or with `act` if you have it.
name: ci
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      COPILOT_LOG_JSON: "false"
      COPILOT_OTEL_EXPORTER: none
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - name: Install (dev extras, no ML models)
        run: uv venv && uv pip install -e ".[dev]"
      - name: Lint
        run: uv run ruff check . && uv run ruff format --check .
      - name: Unit tests
        run: uv run pytest -q -m "not integration"
      - name: Golden set verify (every gold answer/section exists verbatim in the corpus)
        run: uv run python -m copilot.evals verify
      - name: Eval regression gate (fast config vs evals/baselines/fast.json)
        run: uv run python scripts/eval_gate.py --tolerance 0.02
  integration:
    runs-on: ubuntu-latest
    services:
      db:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      COPILOT_TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - run: uv venv && uv pip install -e ".[dev]"
      - run: uv run pytest -q -m integration
